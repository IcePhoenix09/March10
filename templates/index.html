<!DOCTYPE html>
<html>
<head>
    <title>CIFAR-100 Classifier</title>
</head>
<body>
    <h1>CIFAR-100 Classifier</h1>
    
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <br><br>
        <button type="submit">Upload and Predict</button>
    </form>

    {% if prediction %}
    <div class="result success">
        <h3>Prediction: {{ prediction }}</h3>
        <p>Confidence: {{ confidence }}</p>
        <br>
        <img src="{{ image_url }}" alt="Uploaded Image" style="max-width: 300px; border: 1px solid #ccc; border-radius: 5px;">
    </div>
    {% endif %}

    {% if error %}
    <div class="result error">
        <h3>Error</h3>
        <p>{{ error }}</p>
    </div>
    {% endif %}
</body>
</html>
